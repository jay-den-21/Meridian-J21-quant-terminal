app:
  env: local

database:
  driver: mysql+pymysql
  host: ${FDP_DB_HOST}
  port: ${FDP_DB_PORT}
  user: ${FDP_DB_USER}
  password: ${FDP_DB_PASSWORD}
  database: ${FDP_DB_NAME}

schemas:
  us_share: us_share
  # A-share schema for this project. Legacy local program/database name: qtdb_pro.
  a_share: a_share
  system: system
  test_us_share: test_us_share
  test_a_share: test_a_share
  test_system: test_system

sources:
  eodhd:
    api_key: ${EODHD_API_KEY}
    base_url: https://eodhd.com/api
    max_retries: 5
    retry_delay_seconds: 61
    # EODHD documents 1000 requests/minute. Keep the default below the hard ceiling.
    max_requests_per_minute: 600
    daily_call_budget: 100000
    daily_range_parallel:
      enabled: false
      max_workers: 4
